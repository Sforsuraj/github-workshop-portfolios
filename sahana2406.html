<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahana Ramesh | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 45px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .profile {
            width: 110px;
            height: 110px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6ec4, #7873f5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            border: 4px solid white;
        }

        h1 {
            margin-top: 20px;
            font-size: 38px;
        }

        h1 span {
            color: #ff7eb3;
        }

        .intro {
            margin: 15px 0 25px;
            color: #ddd;
            line-height: 1.6;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .skill {
            padding: 10px 18px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            background: linear-gradient(90deg, #ff6ec4, #7873f5);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .btn:hover {
            transform: scale(1.08);
        }

        footer {
            margin-top: 30px;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">SR</div>

        <h1>Hi, I'm <span>Sahana Ramesh</span> 👋</h1>

        <p class="intro">
            A creative student passionate about technology,
            web development and learning new things.
        </p>

        <div class="skills">
            <div class="skill">💻 HTML</div>
            <div class="skill">🎨 Design</div>
            <div class="skill">🤖 AI</div>
            <div class="skill">💡 Creativity</div>
        </div>

        <a href="#" class="btn">✨ Explore My World</a>

        <footer>
            Made with ❤️ by Sahana Ramesh
        </footer>

    </div>

</body>
</html>
