<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushmitha | Digital City</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020611;
    font-family:Arial,Helvetica,sans-serif;
}

#city{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= LOADER ================= */

#loader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
        radial-gradient(circle at center,#071426 0%,#02050c 48%,#000 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
}

.loader-title{
    font-size:clamp(38px,6vw,90px);
    font-weight:900;
    letter-spacing:12px;
    text-align:center;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 30px #00d9ff,
        0 0 70px #008cff;
}

.loader-sub{
    margin-top:22px;
    color:#00d9ff;
    letter-spacing:7px;
    font-size:12px;
    text-align:center;
}

.progress-wrap{
    width:min(420px,70vw);
    height:5px;
    background:#162238;
    margin-top:30px;
    overflow:hidden;
    border-radius:10px;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00d9ff,#8a5cff);
    box-shadow:0 0 15px #00d9ff;
    transition:width .2s;
}

#loadingText{
    margin-top:15px;
    color:#7f93ad;
    font-size:12px;
    letter-spacing:2px;
}

#enterBtn{
    display:none;
    margin-top:30px;
    padding:15px 32px;
    border:1px solid #00d9ff;
    background:rgba(0,217,255,.08);
    color:#fff;
    border-radius:6px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:
        0 0 15px rgba(0,217,255,.3),
        inset 0 0 15px rgba(0,217,255,.05);
}

#enterBtn:hover{
    background:#00d9ff;
    color:#001018;
}

#errorBox{
    display:none;
    width:min(650px,85vw);
    margin-top:25px;
    padding:18px;
    border:1px solid #ff4567;
    background:rgba(255,0,60,.08);
    color:#ff9bad;
    font-size:13px;
    line-height:1.6;
    text-align:center;
    border-radius:8px;
}

/* ================= HUD ================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
}

.brand{
    position:absolute;
    top:22px;
    left:25px;
    color:white;
    font-weight:900;
    letter-spacing:4px;
    font-size:17px;
    text-shadow:0 0 15px #00d9ff;
}

.status{
    position:absolute;
    top:23px;
    right:25px;
    color:#00ffb3;
    font-size:11px;
    letter-spacing:2px;
}

.status span{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ffb3;
    box-shadow:0 0 12px #00ffb3;
    margin-right:7px;
}

.controls{
    position:absolute;
    bottom:22px;
    left:25px;
    color:#9db0c9;
    font-size:11px;
    line-height:1.8;
    letter-spacing:1px;
}

.controls b{
    color:#fff;
}

#interaction{
    display:none;
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:13px 25px;
    background:rgba(2,8,20,.88);
    border:1px solid #00d9ff;
    color:#fff;
    border-radius:5px;
    box-shadow:0 0 25px rgba(0,217,255,.25);
    font-size:12px;
    letter-spacing:2px;
}

/* ================= PANEL ================= */

#panel{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,3,10,.78);
    backdrop-filter:blur(10px);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.panel-box{
    width:min(900px,95vw);
    max-height:85vh;
    overflow:auto;
    background:
        linear-gradient(145deg,
        rgba(10,22,40,.98),
        rgba(2,7,18,.98));
    border:1px solid #00d9ff;
    border-radius:14px;
    padding:35px;
    color:white;
    box-shadow:
        0 0 50px rgba(0,217,255,.2),
        inset 0 0 40px rgba(0,100,255,.03);
}

.close{
    float:right;
    width:35px;
    height:35px;
    border:1px solid #47627e;
    background:transparent;
    color:white;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.close:hover{
    background:#00d9ff;
    color:#001018;
}

.panel-title{
    font-size:35px;
    margin-bottom:8px;
    color:#fff;
    text-shadow:0 0 15px #00d9ff;
}

.panel-line{
    height:2px;
    width:70px;
    background:#00d9ff;
    margin-bottom:25px;
}

.panel-box p{
    color:#aebed1;
    line-height:1.8;
    margin-bottom:18px;
}

.panel-box h3{
    color:#00d9ff;
    margin:25px 0 12px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    padding:18px;
    border:1px solid #203850;
    border-radius:9px;
    background:rgba(255,255,255,.025);
    transition:.3s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#00d9ff;
    box-shadow:0 0 20px rgba(0,217,255,.15);
}

.card h4{
    color:white;
    margin-bottom:8px;
}

.card small{
    color:#00d9ff;
}

.card p{
    font-size:13px;
    margin-top:10px;
}

.card a{
    display:inline-block;
    margin-top:10px;
    color:#00d9ff;
    text-decoration:none;
    font-size:12px;
}

.skill{
    margin:12px 0;
}

.skill-name{
    display:flex;
    justify-content:space-between;
    color:#c7d5e4;
    font-size:13px;
    margin-bottom:6px;
}

.skill-bar{
    height:7px;
    background:#132238;
    border-radius:10px;
    overflow:hidden;
}

.skill-fill{
    height:100%;
    background:linear-gradient(90deg,#00d9ff,#8b5cff);
    box-shadow:0 0 10px #00d9ff;
}

/* MOBILE */

@media(max-width:600px){

    .loader-title{
        letter-spacing:5px;
    }

    .brand{
        font-size:12px;
        left:15px;
    }

    .status{
        right:15px;
        font-size:9px;
    }

    .controls{
        display:none;
    }

    .panel-box{
        padding:23px;
    }

    .panel-title{
        font-size:27px;
    }
}
</style>
</head>

<body>

<!-- ================= LOADER ================= -->

<div id="loader">

    <div class="loader-title">
        SUSHMITHA CITY
    </div>

    <div class="loader-sub">
        INITIALIZING DIGITAL WORLD...
    </div>

    <div class="progress-wrap">
        <div id="progress"></div>
    </div>

    <div id="loadingText">
        Loading 3D engine...
    </div>

    <button id="enterBtn">
        ENTER CITY →
    </button>

    <div id="errorBox"></div>

</div>

<canvas id="city"></canvas>

<!-- ================= HUD ================= -->

<div id="hud">

    <div class="brand">
        SUSHMITHA // DIGITAL CITY
    </div>

    <div class="status">
        <span></span>
        CITY SYSTEM ONLINE
    </div>

    <div class="controls">
        <b>W A S D</b> / ARROWS — MOVE<br>
        <b>MOUSE DRAG</b> — LOOK AROUND<br>
        <b>SCROLL</b> — CAMERA ZOOM<br>
        <b>E</b> — ENTER BUILDING
    </div>

    <div id="interaction">
        PRESS <b>E</b> TO ENTER
    </div>

</div>

<!-- ================= PANEL ================= -->

<div id="panel">

    <div class="panel-box">

        <button class="close" onclick="closePanel()">×</button>

        <div id="panelContent"></div>

    </div>

</div>


<script>

/* ============================================================
   SAFE THREE.JS LOADER
============================================================ */

const progress = document.getElementById("progress");
const loadingText = document.getElementById("loadingText");
const enterBtn = document.getElementById("enterBtn");
const errorBox = document.getElementById("errorBox");

let fakeProgress = 0;

const progressTimer = setInterval(() => {

    if(fakeProgress < 85){

        fakeProgress += Math.random()*4;

        if(fakeProgress > 85)
            fakeProgress = 85;

        progress.style.width = fakeProgress + "%";
    }

},200);


/* Try first CDN */

function loadScript(url){

    return new Promise((resolve,reject)=>{

        const script = document.createElement("script");

        script.src = url;

        script.onload = () => resolve();

        script.onerror = () => reject();

        document.head.appendChild(script);

    });

}


async function loadThree(){

    loadingText.innerText = "Connecting to 3D engine...";

    if(window.THREE){

        return true;

    }

    const cdns = [

        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",

        "https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js",

        "https://unpkg.com/three@0.160.0/build/three.min.js"

    ];

    for(const url of cdns){

        try{

            loadingText.innerText =
                "Loading 3D engine...";

            await loadScript(url);

            if(window.THREE){

                return true;

            }

        }catch(e){

            console.log("CDN failed:",url);

        }

    }

    return false;
}


/* ============================================================
   INITIALIZE
============================================================ */

async function boot(){

    const success = await loadThree();

    clearInterval(progressTimer);

    if(!success){

        progress.style.width="100%";

        loadingText.innerText =
            "3D engine could not be loaded.";

        errorBox.style.display="block";

        errorBox.innerHTML =
        "The browser could not load the Three.js 3D engine.<br><br>" +
        "Please make sure you are connected to the internet, " +
        "then refresh the page.<br><br>" +
        "<b>Press Ctrl + R to try again.</b>";

        return;

    }

    progress.style.width="100%";

    loadingText.innerText =
        "Digital world ready.";

    enterBtn.style.display="block";

}


/* ============================================================
   ENTER CITY
============================================================ */

enterBtn.addEventListener("click",()=>{

    enterBtn.style.display="none";

    document.getElementById("loader").style.opacity="0";

    document.getElementById("loader").style.transition="opacity .8s";

    setTimeout(()=>{

        document.getElementById("loader").style.display="none";

        document.getElementById("hud").style.display="block";

        startCity();

    },800);

});


boot();


/* ============================================================
   CITY VARIABLES
============================================================ */

let scene;
let camera;
let renderer;
let player;

let buildings=[];

let keys={};

let yaw=0;
let pitch=0;

let dragging=false;
let previousMouseX=0;
let previousMouseY=0;


/* ============================================================
   START CITY
============================================================ */

function startCity(){

    try{

        scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x020611);

        scene.fog =
            new THREE.Fog(0x020611,80,280);


        /* CAMERA */

        camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0,6,25);


        /* RENDERER */

        renderer = new THREE.WebGLRenderer({
            canvas:document.getElementById("city"),
            antialias:true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio,2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        /* LIGHT */

        const ambient =
            new THREE.AmbientLight(
                0x7da9ff,
                1.5
            );

        scene.add(ambient);


        const moon =
            new THREE.DirectionalLight(
                0x9ccaff,
                2
            );

        moon.position.set(
            50,
           100,
           50
        );

        scene.add(moon);


        /* CITY */

        createGround();

        createRoads();

        createBuildings();

        createCentralHQ();

        createStreetLights();

        createStars();

        createPlayer();


        /* EVENTS */

        window.addEventListener(
            "resize",
            resize
        );

        document.addEventListener(
            "keydown",
            keyDown
        );

        document.addEventListener(
            "keyup",
            keyUp
        );

        document.addEventListener(
            "mousedown",
            mouseDown
        );

        document.addEventListener(
            "mouseup",
            mouseUp
        );

        document.addEventListener(
            "mousemove",
            mouseMove
        );

        document.addEventListener(
            "wheel",
            zoom
        );


        animate();

    }catch(error){

        console.error(error);

        alert(
            "City initialization error.\n\n" +
            error.message
        );

    }

}


/* ============================================================
   GROUND
============================================================ */

function createGround(){

    const geometry =
        new THREE.PlaneGeometry(
            320,
            320
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x030b15,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x=-Math.PI/2;

    scene.add(ground);


    /* GRID */

    const grid =
        new THREE.GridHelper(
            320,
            80,
            0x123b55,
            0x081a2b
        );

    grid.position.y=.03;

    scene.add(grid);

}


/* ============================================================
   ROADS
============================================================ */

function createRoads(){

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color:0x080f19
        });


    for(let x=-120;x<=120;x+=60){

        const road =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    12,
                    .08,
                    300
                ),
                roadMaterial
            );

        road.position.set(
            x,
            .05,
            0
        );

        scene.add(road);

    }


    for(let z=-120;z<=120;z+=60){

        const road =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    300,
                    .08,
                    12
                ),
                roadMaterial
            );

        road.position.set(
            0,
            .05,
            z
        );

        scene.add(road);

    }


    /* ROAD LIGHT STRIPS */

    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color:0x00d9ff
        });


    for(let x=-120;x<=120;x+=60){

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    .12,
                    300
                ),
                lineMaterial
            );

        line.position.set(
            x,
            .13,
            0
        );

        scene.add(line);

    }

}


/* ============================================================
   BUILDINGS
============================================================ */

const buildingData=[

    {
        name:"ABOUT",
        x:-90,
        z:-90,
        height:22,
        color:0x00d9ff,
        type:"about"
    },

    {
        name:"SKILLS",
        x:90,
        z:-90,
        height:30,
        color:0x8a5cff,
        type:"skills"
    },

    {
        name:"PROJECTS",
        x:-90,
        z:90,
        height:34,
        color:0x00ffb3,
        type:"projects"
    },

    {
        name:"JOURNEY",
        x:90,
        z:90,
        height:27,
        color:0xff5bd8,
        type:"journey"
    },

    {
        name:"DEV LAB",
        x:-150,
        z:0,
        height:25,
        color:0xffb84d,
        type:"lab"
    },

    {
        name:"CONNECT",
        x:150,
        z:0,
        height:25,
        color:0x4d9fff,
        type:"contact"
    }

];


function createBuildings(){

    buildingData.forEach(data=>{

        const group =
            new THREE.Group();

        const body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    28,
                    data.height,
                    28
                ),
                new THREE.MeshStandardMaterial({
                    color:0x071525,
                    metalness:.5,
                    roughness:.45
                })
            );

        body.position.y=
            data.height/2;

        group.add(body);


        /* TOP */

        const top =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    30,
                    .5,
                    30
                ),
                new THREE.MeshBasicMaterial({
                    color:data.color
                })
            );

        top.position.y=
            data.height+.3;

        group.add(top);


        /* WINDOWS */

        for(let y=4;y<data.height;y+=5){

            for(let side=-1;side<=1;side+=2){

                const windows =
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            18,
                            1.4,
                            .15
                        ),
                        new THREE.MeshBasicMaterial({
                            color:data.color
                        })
                    );

                windows.position.set(
                    0,
                    y,
                    side*14.1
                );

                group.add(windows);

            }

        }


        group.position.set(
            data.x,
            0,
            data.z
        );


        scene.add(group);


        buildings.push({

            ...data,

            object:group

        });


        createLabel(
            data.name,
            data.x,
            data.height+5,
            data.z,
            data.color
        );

    });

}


/* ============================================================
   BUILDING LABEL
============================================================ */

function createLabel(
    text,
    x,
    y,
    z,
    color
){

    const canvas =
        document.createElement("canvas");

    canvas.width=512;
    canvas.height=128;

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        512,
        128
    );

    ctx.font=
        "bold 52px Arial";

    ctx.textAlign=
        "center";

    ctx.fillStyle=
        "#ffffff";

    ctx.shadowColor=
        "#" + color.toString(16).padStart(6,"0");

    ctx.shadowBlur=25;

    ctx.fillText(
        text,
        256,
        70
    );


    const texture=
        new THREE.CanvasTexture(canvas);


    const material=
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });


    const sprite=
        new THREE.Sprite(material);

    sprite.scale.set(
        28,
        7,
        1
    );

    sprite.position.set(
        x,
        y,
        z
    );

    scene.add(sprite);

}


/* ============================================================
   CENTRAL HQ
============================================================ */

function createCentralHQ(){

    const base =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                20,
                24,
                3,
                48
            ),
            new THREE.MeshStandardMaterial({
                color:0x071a2b,
                metalness:.8,
                roughness:.25
            })
        );

    base.position.y=1.5;

    scene.add(base);


    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                9,
                13,
                35,
                32
            ),
            new THREE.MeshStandardMaterial({
                color:0x071525,
                metalness:.7,
                roughness:.3
            })
        );

    tower.position.y=20;

    scene.add(tower);


    const ring =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                14,
                .5,
                12,
                64
            ),
            new THREE.MeshBasicMaterial({
                color:0x00d9ff
            })
        );

    ring.rotation.x=
        Math.PI/2;

    ring.position.y=12;

    scene.add(ring);


    createLabel(
        "SUSHMITHA HQ",
        0,
        45,
        0,
        0x00d9ff
    );

}


/* ============================================================
   STREET LIGHTS
============================================================ */

function createStreetLights(){

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color:0x182331
        });

    const lampMaterial =
        new THREE.MeshBasicMaterial({
            color:0x00d9ff
        });


    for(let x=-120;x<=120;x+=30){

        for(let z=-150;z<=150;z+=30){

            if(Math.abs(x)%60===0)
                continue;

            const pole =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .12,
                        .12,
                        5,
                        8
                    ),
                    poleMaterial
                );

            pole.position.set(
                x,
                2.5,
                z
            );

            scene.add(pole);


            const lamp =
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        .3,
                        8,
                        8
                    ),
                    lampMaterial
                );

            lamp.position.set(
                x,
                5,
                z
            );

            scene.add(lamp);

        }

    }

}


/* ============================================================
   STARS / PARTICLES
============================================================ */

function createStars(){

    const geometry=
        new THREE.BufferGeometry();

    const positions=[];

    for(let i=0;i<1200;i++){

        positions.push(
            (Math.random()-.5)*500,
            Math.random()*180+20,
            (Math.random()-.5)*500
        );

    }

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    const material=
        new THREE.PointsMaterial({
            color:0x6bdcff,
            size:.7,
            transparent:true,
            opacity:.8
        });


    const stars=
        new THREE.Points(
            geometry,
            material
        );

    scene.add(stars);

}


/* ============================================================
   PLAYER
============================================================ */

function createPlayer(){

    player=
        new THREE.Group();


    const body=
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .7,
                1.5,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x00d9ff,
                emissive:0x003344
            })
        );

    body.position.y=1.5;

    player.add(body);


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .5,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff,
                emissive:0x003344
            })
        );

    head.position.y=3;

    player.add(head);


    player.position.set(
        0,
        0,
        25
    );


    scene.add(player);

}


/* ============================================================
   KEYBOARD
============================================================ */

function keyDown(e){

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="e"){

        checkBuilding();

    }

}


function keyUp(e){

    keys[e.key.toLowerCase()]=false;

}


/* ============================================================
   MOVEMENT
============================================================ */

function updatePlayer(){

    if(!player)
        return;


    let speed=.45;

    let dx=0;
    let dz=0;


    if(keys["w"] || keys["arrowup"])
        dz-=speed;

    if(keys["s"] || keys["arrowdown"])
        dz+=speed;

    if(keys["a"] || keys["arrowleft"])
        dx-=speed;

    if(keys["d"] || keys["arrowright"])
        dx+=speed;


    player.position.x+=dx;
    player.position.z+=dz;


    /* CITY LIMIT */

    player.position.x=
        Math.max(
            -145,
            Math.min(
                145,
                player.position.x
            )
        );

    player.position.z=
        Math.max(
            -145,
            Math.min(
                145,
                player.position.z
            )
        );


    /* CAMERA */

    const distance=16;

    camera.position.x=
        player.position.x+
        Math.sin(yaw)*distance;

    camera.position.z=
        player.position.z+
        Math.cos(yaw)*distance;

    camera.position.y=
        player.position.y+
        7+
        pitch;


    camera.lookAt(
        player.position.x,
        3,
        player.position.z
    );

}


/* ============================================================
   BUILDING DETECTION
============================================================ */

function checkBuilding(){

    if(!player)
        return;


    let nearest=null;
    let distance=Infinity;


    buildings.forEach(b=>{

        const dx=
            player.position.x-b.x;

        const dz=
            player.position.z-b.z;

        const d=
            Math.sqrt(
                dx*dx+dz*dz
            );

        if(d<distance){

            distance=d;
            nearest=b;

        }

    });


    if(nearest && distance<25){

        openPanel(nearest.type);

    }

}


/* ============================================================
   MOUSE CAMERA
============================================================ */

function mouseDown(e){

    dragging=true;

    previousMouseX=e.clientX;
    previousMouseY=e.clientY;

}


function mouseUp(){

    dragging=false;

}


function mouseMove(e){

    if(!dragging)
        return;


    const dx=
        e.clientX-previousMouseX;

    const dy=
        e.clientY-previousMouseY;


    yaw-=dx*.004;

    pitch+=dy*.03;

    pitch=
        Math.max(
            -3,
            Math.min(
                3,
                pitch
            )
        );


    previousMouseX=e.clientX;
    previousMouseY=e.clientY;

}


/* ============================================================
   ZOOM
============================================================ */

function zoom(e){

    camera.fov +=
        e.deltaY*.03;

    camera.fov=
        Math.max(
            35,
            Math.min(
                80,
                camera.fov
            )
        );

    camera.updateProjectionMatrix();

}

/* ============================================================
   RESIZE
============================================================ */

function resize(){

    if(!camera || !renderer)
        return;

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* ============================================================
   ANIMATION
============================================================ */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();


    if(player){

        player.rotation.y=
            yaw;

    }


    renderer.render(
        scene,
        camera
    );

}
